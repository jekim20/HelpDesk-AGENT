name: helpdesk-agent

services:
  postgres:
    image: ${HELPDESK_POSTGRES_IMAGE:?Set a digest-pinned PostgreSQL image in the release file}
    environment:
      POSTGRES_DB: ${HELPDESK_DB_NAME:-helpdesk}
      POSTGRES_USER: ${HELPDESK_DB_USERNAME:-helpdesk}
      POSTGRES_PASSWORD: ${HELPDESK_DB_PASSWORD:?Load the DB password from SSM Parameter Store}
    volumes:
      - type: bind
        source: ${HELPDESK_PGDATA_PATH:?Set the PostgreSQL EBS mount path}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app_net]

  app:
    image: ${HELPDESK_APP_IMAGE:?Set a digest-pinned application image in the release file}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${HELPDESK_DB_NAME:-helpdesk}
      DB_USERNAME: ${HELPDESK_DB_USERNAME:-helpdesk}
      DB_PASSWORD: ${HELPDESK_DB_PASSWORD:?Load the DB password from SSM Parameter Store}
      APP_USER1_PASSWORD: ${APP_USER1_PASSWORD:?Load the user1 password from SSM Parameter Store}
      APP_USER2_PASSWORD: ${APP_USER2_PASSWORD:?Load the user2 password from SSM Parameter Store}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Load the admin password from SSM Parameter Store}
      OPENAI_API_KEY: ${HELPDESK_OPENAI_API_KEY:-not-set}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 1400m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app_net]

  frontend:
    image: ${HELPDESK_FRONTEND_IMAGE:?Set a digest-pinned frontend image in the release file}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [app_net]

networks:
  app_net:
    driver: bridge
