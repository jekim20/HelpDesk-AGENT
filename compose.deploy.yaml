name: helpdesk-deploy-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${HELPDESK_DB_PASSWORD:?Set HELPDESK_DB_PASSWORD in the deployment env file}
    volumes:
      - deploy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: ${HELPDESK_DB_PASSWORD:?Set HELPDESK_DB_PASSWORD in the deployment env file}
      APP_USER1_PASSWORD: ${APP_USER1_PASSWORD:?Set APP_USER1_PASSWORD in the deployment env file}
      APP_USER2_PASSWORD: ${APP_USER2_PASSWORD:?Set APP_USER2_PASSWORD in the deployment env file}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in the deployment env file}
      OPENAI_API_KEY: ${HELPDESK_OPENAI_API_KEY:-not-set}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    mem_limit: 1400m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_net

volumes:
  deploy_postgres_data:

networks:
  app_net:
    driver: bridge
