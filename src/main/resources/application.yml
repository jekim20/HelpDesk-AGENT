spring:
  application:
    name: devdesk-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USERNAME:helpdesk}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  ai:
    openai:
      # 키는 소스에 넣지 않는다.  export OPENAI_API_KEY="sk-..."
      # AI 키가 없거나 provider 오류가 나도 결정형 비AI 경로는 계속 제공한다.
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small
    retry:
      # Avoid repeating paid chat/embedding requests after transient failures.
      max-attempts: 1

  http:
    client:
      connect-timeout: 2s
      read-timeout: 8s

    # 운영에서는 프롬프트 원문 로깅을 반드시 끈다(개인정보가 그대로 쌓인다).
    chat:
      observations:
        log-prompt: false
      client:
        observations:
          log-prompt: false

server:
  port: 8080

# ── API 문서 · Swagger UI ──────────────────────────────────
#   화면 http://localhost:8080/swagger-ui.html   문서 /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        ai:
          include: ragIndex
          show-details: always
  metrics:
    tags:
      application: devdesk-ai

logging:
  level:
    com.devdesk.agent: INFO
    org.springframework.web: INFO
    org.springframework.ai: INFO
    # Spring AI's retry interceptor logs provider exception bodies (which can contain sensitive diagnostics).
    org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration: ERROR
    org.springframework.boot.autoconfigure: INFO
    # SimpleLoggerAdvisor 의 요청·응답 로그를 보려면 DEBUG 로 올린다(개발 환경에서만).
    org.springframework.ai.chat.client.advisor: INFO

app:
  security:
    # Credentials come from the environment. Empty values disable that local account.
    user1-password: ${APP_USER1_PASSWORD:}
    user2-password: ${APP_USER2_PASSWORD:}
    admin-password: ${APP_ADMIN_PASSWORD:}
  ai:
    # 운영에서는 primary와 다른 모델명으로 설정할 수 있다.
    fallback-model: ${FALLBACK_MODEL:gpt-4o-mini}
