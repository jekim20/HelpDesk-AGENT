management:
  server:
    address: 0.0.0.0
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ai.latency: true
        ai.tool.latency: true

app:
  monitoring:
    readiness-sample-interval-ms: 5000
