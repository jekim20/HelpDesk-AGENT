name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Java tests
        run: ./gradlew test

      - name: Run Python evaluator tests
        run: python -m unittest scripts/test_evaluate_agent.py scripts/test_evaluate_prompt_injection.py

      - name: Verify application build
        run: ./gradlew build
