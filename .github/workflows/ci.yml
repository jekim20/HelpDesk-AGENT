name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: helpdesk_test
          POSTGRES_USER: helpdesk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Java tests
        env:
          TICKET_IT_DB_URL: jdbc:postgresql://127.0.0.1:5432/helpdesk_test
          TICKET_IT_DB_USERNAME: helpdesk
        run: ./gradlew test --no-daemon

      - name: Require PostgreSQL integration tests to run
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          report = pathlib.Path("build/test-results/test/TEST-com.devdesk.agent.TicketRepositoryPostgresIntegrationTest.xml")
          if not report.exists():
              raise SystemExit("PostgreSQL integration test report is missing")
          suite = ET.parse(report).getroot()
          tests = int(suite.attrib.get("tests", 0))
          skipped = int(suite.attrib.get("skipped", 0))
          failures = int(suite.attrib.get("failures", 0)) + int(suite.attrib.get("errors", 0))
          print(f"PostgreSQL integration tests: tests={tests}, skipped={skipped}, failures={failures}")
          if tests != 10 or skipped != 0 or failures != 0:
              raise SystemExit("Expected all 10 PostgreSQL integration tests to execute and pass")
          PY

      - name: Run Python evaluator tests
        run: python -m unittest scripts/test_evaluate_agent.py scripts/test_evaluate_agent_auth.py scripts/test_evaluate_prompt_injection.py

      - name: Verify application build
        run: ./gradlew bootJar --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull PostgreSQL fixtures and record manifest digests
        id: postgres-fixtures
        run: |
          set -Eeuo pipefail
          pg16_output=$(docker pull postgres:16-alpine 2>&1)
          printf '%s\n' "$pg16_output"
          pg17_output=$(docker pull postgres:17-alpine 2>&1)
          printf '%s\n' "$pg17_output"
          pg16_digest=$(sed -nE 's/^Digest: (sha256:[a-f0-9]{64})$/\1/p' <<<"$pg16_output" | tail -n 1)
          pg17_digest=$(sed -nE 's/^Digest: (sha256:[a-f0-9]{64})$/\1/p' <<<"$pg17_output" | tail -n 1)
          [[ "$pg16_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$pg17_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'pg16_digest=%s\npg17_digest=%s\n' "$pg16_digest" "$pg17_digest" >> "$GITHUB_OUTPUT"

      - name: Run AWS release failure-injection suite
        env:
          TEST_POSTGRES_16_DIGEST: ${{ steps.postgres-fixtures.outputs.pg16_digest }}
          TEST_POSTGRES_17_DIGEST: ${{ steps.postgres-fixtures.outputs.pg17_digest }}
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          python deploy/aws/tests/test-release.py | tee artifacts/ci/release-failure-injection.log

      - name: Validate ARM64 backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          tags: helpdesk-agent:${{ github.sha }}

      - name: Validate ARM64 frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/arm64
          push: false
          tags: helpdesk-frontend:${{ github.sha }}

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser E2E
        env:
          E2E_RUN_K6: "0"
        run: npm test --prefix e2e
        timeout-minutes: 20

      - name: Summarize test skips and failures
        if: always()
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import xml.etree.ElementTree as ET
          totals = {name: 0 for name in ("tests", "skipped", "failures", "errors")}
          skipped = []
          for filename in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(filename).getroot()
              for name in totals:
                  totals[name] += int(root.attrib.get(name, 0))
              for case in root.iter("testcase"):
                  if case.find("skipped") is not None:
                      skipped.append(f"{pathlib.Path(filename).name}::{case.attrib.get('name', '')}")
          print(f"JUnit totals: {totals}; passed={totals['tests']-totals['skipped']-totals['failures']-totals['errors']}")
          for case in skipped:
              print(f"SKIPPED: {case}")
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\n### JUnit results\n\n- Tests: {totals['tests']}\n- Passed: {totals['tests']-totals['skipped']-totals['failures']-totals['errors']}\n- Skipped: {totals['skipped']}\n- Failures: {totals['failures']}\n- Errors: {totals['errors']}\n")
              if skipped:
                  summary.write("\nSkipped tests:\n" + "\n".join(f"- `{case}`" for case in skipped) + "\n")
          PY

      - name: Upload test and E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/test/
            build/reports/tests/test/
            artifacts/e2e/runs/
            artifacts/ci/release-failure-injection.log
          if-no-files-found: warn
          retention-days: 14
